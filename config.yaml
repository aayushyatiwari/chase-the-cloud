# Data Settings
data:
  manifest_path: "data/manifest_full.json"
  T: 6
  train_split: 0.8
  crop_size: 256
  # Spacing of the fixed validation crop grid. 256 = non-overlapping (36 crops
  # on a 1616x1737 sector); raise it for fewer crops and quicker validation.
  val_crop_stride: 512

# Training Hyperparameters
train:
  seed: 42
  batch_size: 2
  lr: 0.0001
  epochs: 100
  num_workers: 0
  checkpoint_dir: "checkpoints"
  # Stop after this many epochs with no validation improvement.
  early_stopping_patience: 10
  early_stopping_min_delta: 0.00001
  # null to train from scratch; a .pt path or 'latest' to continue training
  resume_from: null # latest for last checkpoint

# Model Architecture
model:
  type: convlstm # convlstm or simvp
  # true = predict the change from the last frame instead of the whole frame
  residual: true

  # ConvLSTM
  hidden_dim: 64
  kernel_size: 3
  num_layers: 3

  # SimVP
  hid_S: 64
  hid_T: 256
  N_S: 4
  N_T: 4
  groups: 8

# Logging
logging:
  project: "cloud-diffusion"
  use_wandb: true
