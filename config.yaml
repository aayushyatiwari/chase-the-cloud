# Data Settings
data:
  manifest_path: "data/manifest_full.json"
  T: 6
  crop_size: 256

  # Inclusive date ranges. 16 and 24 July 2024 belong to no split: they are
  # buffer days keeping train, val and test more than a day apart.
  splits:
    train: ["2023-07-01", "2024-07-15"]   # 1960 windows, 73%
    val:   ["2024-07-17", "2024-07-23"]   #  310 windows, 12%
    test:  ["2024-07-25", "2024-07-31"]   #  322 windows, 12%

  # Val is a training signal (early stopping, LR schedule, checkpoint choice),
  # so it is not an unbiased estimate. Turn this on once, at the end.
  evaluate_test: false
  # Spacing of the fixed validation crop grid. 256 = non-overlapping (36 crops
  # on a 1616x1737 sector); raise it for fewer crops and quicker validation.
  val_crop_stride: 512

# Training Hyperparameters
train:
  seed: 42
  batch_size: 2
  epochs: 2
  num_workers: 2
  lr: 0.0001
  lr_schedule: true
  lr_factor: 0.5
  lr_patience: 3
  lr_min: 1.0e-6
  checkpoint_dir: "checkpoints"
  # Stop after this many epochs with no validation improvement.
  early_stopping_patience: 10
  early_stopping_min_delta: 0.00001
  # null to train from scratch; a .pt path or 'latest' to continue training
  resume_from: null # latest for last checkpoint

# Model Architecture
model:
  type: convlstm # convlstm or simvp
  # true = predict the change from the last frame instead of the whole frame
  residual: false

  # ConvLSTM
  hidden_dim: 64
  kernel_size: 3
  num_layers: 3

  # SimVP
  hid_S: 64
  hid_T: 256
  N_S: 4
  N_T: 4
  groups: 8

# Logging
logging:
  project: "cloud-diffusion"
  use_wandb: true
