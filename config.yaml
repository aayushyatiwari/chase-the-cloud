# Data Settings
data:
  manifest_path: "data/manifest.json"
  T: 6
  train_split: 0.8

# Training Hyperparameters
train:
  batch_size: 2
  # 3.0e5 both parse as strings. Use plain decimals to stay out of trouble.
  lr: 0.00003
  epochs: 20
  num_workers: 2
  checkpoint_dir: "checkpoints"
  save_every: 5
  # null to train from scratch; a .pt path or 'latest' to continue training
  resume_from: latest # latest for last checkpoint

# Model Architecture (ConvLSTM)
model:
  hidden_dim: 64
  kernel_size: 3
  num_layers: 3

# Logging
logging:
  project: "cloud-diffusion"
  use_wandb: true
